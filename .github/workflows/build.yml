name: Build SoundCraft

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          PROJECT_FILE="$(find . \
            -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts -o \
               -name build.gradle -o \
               -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            | sort \
            | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Gradle project not found. No settings.gradle or build.gradle file."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Found Gradle project: $PROJECT_DIR"

      - name: Build Fabric mod
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" \
              -p "$PROJECT_DIR" \
              build --no-daemon
          else
            gradle -p "$PROJECT_DIR" build --no-daemon
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoundCraft-build
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
